<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Chiyo HUB - Sailor Piece</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%230d0f14%27/%3E%3Cpolygon points=%2712,10 24,16 12,22%27 fill=%27%23d4a574%27/%3E%3C/svg%3E"><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet"><style>*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #0d0f14;
  --surface: #161a23;
  --border:  #252b38;
  --accent:  #7c6af7;
  --accent2: #5eead4;
  --text:    #e2e8f0;
  --muted:   #64748b;
  --code-bg: #1e2330;
  --radius:  14px;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(124,106,247,0.18) 0%, transparent 60%);
}
.card {
  width: 100%;
  max-width: 620px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px 28px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  box-shadow: 0 0 0 1px rgba(124,106,247,0.08), 0 20px 60px rgba(0,0,0,0.5);
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  background: rgba(124,106,247,0.1);
  border: 1px solid rgba(124,106,247,0.25);
  border-radius: 100px;
  padding: 4px 10px;
  width: fit-content;
  margin-bottom: 4px;
}
.badge::before {
  content: '';
  width: 6px; height: 6px;
  background: var(--accent2);
  border-radius: 50%;
  box-shadow: 0 0 6px var(--accent2);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
h1 {
  font-size: clamp(1.4rem, 5vw, 1.9rem);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--text) 0%, #94a3b8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.subtitle { font-size: 0.88rem; color: var(--muted); line-height: 1.5; }
.script-block { display: flex; flex-direction: column; gap: 10px; }
.label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.code-wrap {
  position: relative;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
code {
  display: block;
  padding: 16px;
  font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
  font-size: clamp(0.68rem, 2.6vw, 0.8rem);
  line-height: 1.7;
  color: #a5f3fc;
  word-break: break-all;
  overflow-wrap: anywhere;
  user-select: all;
  -webkit-user-select: all;
}
.copy-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 15px 20px;
  border: none;
  border-radius: 10px;
  background: var(--accent);
  color: #fff;
  font-size: 0.93rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.18s, transform 0.12s, box-shadow 0.18s;
  box-shadow: 0 4px 20px rgba(124,106,247,0.35);
  letter-spacing: 0.01em;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  min-height: 44px;
}
.copy-btn:hover  { background: #6c5ce7; box-shadow: 0 6px 28px rgba(124,106,247,0.5); }
.copy-btn:active { transform: scale(0.97); }
.copy-btn.copied { background: #059669; box-shadow: 0 4px 20px rgba(5,150,105,0.4); }
.copy-btn svg { width: 17px; height: 17px; flex-shrink: 0; }
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #059669;
  color: #fff;
  font-size: 0.85rem;
  font-weight: 600;
  padding: 10px 22px;
  border-radius: 100px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  white-space: nowrap;
  z-index: 999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.footer { text-align: center; font-size: 0.75rem; color: var(--muted); margin-top: -8px; }
@media (max-width: 420px) { .card { padding: 24px 18px; } }</style></head><body><div class="card">  <div><span class="badge">Script Hub</span>  <h1>Chiyo HUB - Sailor Piece</h1>  <p class="subtitle" style="margin-top:6px">Copy the loader below and paste it into your Roblox executor.</p></div>  <div class="script-block">    <span class="label">Loader Script</span>    <div class="code-wrap">      <code id="script-text">loadstring(game:HttpGet(&quot;https://raw.githubusercontent.com/kaisenlmao/loader/refs/heads/main/chiyo.lua&quot;))()</code>    </div>  </div>  <button class="copy-btn" id="copyBtn" onclick="copyScript()">    <svg id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>    <svg id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polyline points="20 6 9 17 4 12"/></svg>    <span id="btn-label">Copy Script</span>  </button>  <p class="footer">Tap the button above to copy.</p></div><div class="toast" id="toast">Copied to clipboard!</div><script>var SCRIPT = "loadstring(game:HttpGet(\"https://raw.githubusercontent.com/kaisenlmao/loader/refs/heads/main/chiyo.lua\"))()";function copyScript() {
  var btn   = document.getElementById('copyBtn');
  var lbl   = document.getElementById('btn-label');
  var ic    = document.getElementById('icon-copy');
  var ick   = document.getElementById('icon-check');
  var toast = document.getElementById('toast');
  function setDone() {
    btn.classList.add('copied');
    lbl.textContent = 'Copied!';
    ic.style.display  = 'none';
    ick.style.display = 'block';
    toast.classList.add('show');
    setTimeout(function() {
      btn.classList.remove('copied');
      lbl.textContent  = 'Copy Script';
      ic.style.display  = 'block';
      ick.style.display = 'none';
      toast.classList.remove('show');
    }, 2200);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(SCRIPT).then(setDone).catch(function() { fallback(setDone); });
  } else {
    fallback(setDone);
  }
}
function fallback(cb) {
  var el    = document.getElementById('script-text');
  var sel   = window.getSelection();
  var range = document.createRange();
  range.selectNodeContents(el);
  sel.removeAllRanges();
  sel.addRange(range);
  try { document.execCommand('copy'); } catch(e) {}
  sel.removeAllRanges();
  cb();
}</script></body></html>
